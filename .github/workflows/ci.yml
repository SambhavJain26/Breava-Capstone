name: Breava CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-ml-service:
    name: Machine Learning Diagnostic Validation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install ML dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r ml_service/requirements.txt

    - name: Compile and validate Python syntax
      run: |
        python -m py_compile ml_service/app.py ml_service/Test_NB_Model.py ml_service/Train_NB_Model.py

    - name: Verify GaussianNB inference on clinical sample data
      run: |
        python ml_service/Test_NB_Model.py sample_data/sample_patient_data.csv

  test-server:
    name: API Gateway & Backend Verification
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Validate Express server syntax
      run: |
        node -c server/server.js
        node -c server/routes/auth.js
        node -c server/middleware/auth.js
